<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#050505" />
<meta name="description" content="Selected SkoriyaTech case studies." />
<title>Projects — SkoriyaTech</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{heading:['Outfit','sans-serif'],sans:['Manrope','sans-serif'],mono:['JetBrains Mono','ui-monospace','monospace']},colors:{gold:{DEFAULT:'#D4AF37',100:'#F3E5AB'}}}}};</script>
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
<div id="nav-root"></div>
<main class="pt-20">
  <section class="relative py-28 md:py-36 overflow-hidden border-b border-white/5">
    <div id="hero-c" class="absolute inset-0"></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_left,rgba(212,175,55,0.10),transparent_60%)]"></div>
    <div class="container-tight relative">
      <div class="label-eyebrow mb-6">Selected work · 2018 — Now</div>
      <h1 class="font-heading text-5xl md:text-7xl lg:text-8xl tracking-tight max-w-5xl leading-[0.98]">Things we shipped<br/><span class="text-gold">into the world.</span></h1>
      <p class="mt-8 max-w-2xl text-zinc-400 text-lg">A few of the products that left the lab and are now running in the field — under NDA, edited for what we can show.</p>
    </div>
  </section>

  <section class="py-20 md:py-28">
    <div id="proj-list" class="container-tight space-y-24"></div>
  </section>

  <section class="py-24 md:py-32 border-t border-white/5 bg-[#08080a]">
    <div class="container-tight text-center max-w-3xl mx-auto">
      <h2 class="font-heading text-4xl md:text-5xl tracking-tight">Your product belongs <span class="text-gold">on this list.</span></h2>
      <a href="contact.html" class="mt-10 btn-gold inline-flex">Start a project →</a>
    </div>
  </section>
</main>
<div id="footer-root"></div>
<div id="fab-root"></div>
<script src="assets/site.js"></script>
<script src="assets/data.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  renderConstellation("#hero-c", 28, true);
  document.getElementById("proj-list").innerHTML = PROJECTS.map((p, i) => {
    const rev = i % 2 === 1;
    return `
    <article class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-center ${rev ? "lg:[direction:rtl]" : ""}">
      <div class="lg:col-span-7 [direction:ltr]">
        <div class="relative aspect-[16/10] overflow-hidden border border-white/5 process-img">
          <img src="${p.cover}" alt="${p.title}" class="w-full h-full object-cover" />
          <div class="absolute inset-0 bg-gradient-to-tr from-black/60 via-transparent to-black/30"></div>
          <div class="absolute bottom-6 left-6 font-mono text-xs tracking-[0.25em] text-gold">━ ${p.domain}</div>
        </div>
      </div>
      <div class="lg:col-span-5 [direction:ltr]">
        <div class="font-mono text-xs tracking-[0.25em] text-zinc-500">${String(i+1).padStart(2,"0")} · CASE STUDY</div>
        <h2 class="font-heading text-4xl md:text-5xl tracking-tight mt-3">${p.title}</h2>
        <p class="mt-5 text-zinc-400 leading-relaxed">${p.summary}</p>
        <div class="mt-8 grid grid-cols-3 gap-3">
          ${p.stats.map(s => `<div class="border border-white/10 p-4"><div class="font-heading text-xl text-gold">${s.k}</div><div class="font-mono text-[10px] tracking-[0.2em] uppercase text-zinc-500 mt-1">${s.v}</div></div>`).join("")}
        </div>
        <div class="mt-6 flex flex-wrap gap-2">
          ${p.tags.map(t => `<span class="font-mono text-[10px] tracking-wide uppercase text-zinc-400 border border-white/10 px-2 py-1">${t}</span>`).join("")}
        </div>
      </div>
    </article>`;
  }).join("");
});
</script>
</body>
</html>
