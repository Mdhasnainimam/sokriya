<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#050505" />
<meta name="description" content="Industries served by SkoriyaTech." />
<title>Industries — SkoriyaTech</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{heading:['Outfit','sans-serif'],sans:['Manrope','sans-serif'],mono:['JetBrains Mono','ui-monospace','monospace']},colors:{gold:{DEFAULT:'#D4AF37',100:'#F3E5AB'}}}}};</script>
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
<div id="nav-root"></div>
<main class="pt-20">
  <section class="relative py-28 md:py-36 overflow-hidden border-b border-white/5">
    <div id="hero-c" class="absolute inset-0"></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,rgba(212,175,55,0.12),transparent_60%)]"></div>
    <div class="container-tight relative">
      <div class="label-eyebrow mb-6">Industries</div>
      <h1 class="font-heading text-5xl md:text-7xl lg:text-8xl tracking-tight max-w-5xl leading-[0.98]">Built for <span class="text-gold">regulated, demanding</span> domains.</h1>
      <p class="mt-8 max-w-2xl text-zinc-400 text-lg">Mission-critical environments, certifications and uptime that hurts to lose. That's where our work tends to live.</p>
    </div>
  </section>

  <section class="py-20 md:py-28">
    <div id="ind-grid" class="container-tight grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-px bg-white/5 border border-white/5"></div>
  </section>

  <section class="py-24 md:py-32 border-t border-white/5 bg-[#08080a]">
    <div class="container-tight text-center max-w-3xl mx-auto">
      <div class="label-eyebrow mb-5">Don't see your industry?</div>
      <h2 class="font-heading text-4xl md:text-5xl tracking-tight">If it has <span class="text-gold">circuits, code or constraints</span> — we've probably shipped it.</h2>
      <a href="contact.html" class="mt-10 btn-gold inline-flex">Talk to engineering →</a>
    </div>
  </section>
</main>
<div id="footer-root"></div>
<div id="fab-root"></div>
<script src="assets/site.js"></script>
<script src="assets/data.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  renderConstellation("#hero-c", 28, true);
  document.getElementById("ind-grid").innerHTML = INDUSTRIES.map((i, idx) => `
    <div class="group bg-[#0a0a0c] hover:bg-[#0e0e10] p-8 lg:p-10 min-h-[220px] flex flex-col">
      <div class="flex items-center justify-between">
        <span class="text-gold">${i.icon.replace('width="20"','width="28"').replace('height="20"','height="28"')}</span>
        <span class="font-mono text-[10px] tracking-[0.3em] text-zinc-600">${String(idx+1).padStart(2,"0")}</span>
      </div>
      <h3 class="font-heading text-2xl mt-8">${i.name}</h3>
      <p class="mt-3 text-sm text-zinc-400 leading-relaxed">${i.detail}</p>
    </div>
  `).join("");
});
</script>
</body>
</html>
